name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**/android/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | grep '/android/' | head -n 1 || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android Gradle project was not found."
            echo "Repository tree:"
            find . -maxdepth 4 -type f | sort | head -n 300
            exit 1
          fi

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Found Android project at: $ANDROID_DIR"
          echo "android_dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p "${{ steps.locate.outputs.android_dir }}" :app:assembleDebug

      - name: Prepare APK artifact
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="${{ steps.locate.outputs.android_dir }}"
          APK_FILE="$(find "$ANDROID_DIR/app/build/outputs/apk" -type f -name '*debug*.apk' | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "APK was not generated."
            find "$ANDROID_DIR/app/build/outputs" -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          fi

          mkdir -p release
          cp "$APK_FILE" release/PakhshMahdi-v0.1.2-debug.apk
          echo "apk_path=release/PakhshMahdi-v0.1.2-debug.apk" >> "$GITHUB_OUTPUT"
          ls -lh release/PakhshMahdi-v0.1.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PakhshMahdi-Android-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30
